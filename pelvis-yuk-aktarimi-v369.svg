<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Pelvis ve yük aktarımı</title><desc id="d">Yürüyüş sırasında pelvis, kalça ve alt ekstremite arasında sağ-sol yük aktarımını gösteren modern medikal şema.</desc>
<defs>
