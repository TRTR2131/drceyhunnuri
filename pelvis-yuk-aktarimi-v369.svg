  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77ddff"/><stop offset="1" stop-color="#1288c7"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0b608a" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="760" rx="34" fill="url(#bg3)"/>
